[package]
name = "plane-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
config = { version = "0.15.19", features = ["convert-case"] }
convert_case = "0.6"
dirs = "6.0.0"
headless_chrome = "1.0.20"
reqwest = { version = "0.13.1", features = ["json"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
url = "2.5.8"
inquire = "0.7.5"
toml = "0.8.13"
clap_complete = "4.5.40"

[lib]
name = "plane_cli"
path = "src/lib.rs"


[dev-dependencies]
assert_cmd = "2.0"
httpmock = "0.8.2"
predicates = "2.1"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[[test]]
name = "state"
path = "tests/state.rs"

[[test]]
name = "work_item"
path = "tests/work_item.rs"

[[test]]
name = "project"
path = "tests/project.rs"

[[test]]
name = "label"
path = "tests/label.rs"

[[test]]
name = "link"
path = "tests/link.rs"

[[test]]
name = "user"
path = "tests/user.rs"
