presentation:
  metadata:
    title: "Hands-On: Building REST APIs with FastAPI"
    author: "Alex Chen"
    date: "2026-04-10"
    duration: 120
    type: workshop
    version: "1.0"
  
  purpose:
    primary_goal: "Teach participants to build production-ready REST APIs using FastAPI"
    objectives:
      - "Understand FastAPI fundamentals and async concepts"
      - "Build a complete CRUD API with database"
      - "Implement authentication and validation"
      - "Deploy to production"
    success_criteria:
      - "Each participant has a working API by end of workshop"
      - "Participants can explain async/await in Python"
      - "Everyone deploys their API successfully"
  
  audience:
    profile: "Python developers new to FastAPI"
    size: "15-25 people"
    knowledge_level: "Comfortable with Python, basic web development"
    expectations:
      - "Hands-on coding throughout"
      - "Personal attention when stuck"
      - "Real-world applicable knowledge"
      - "Working example to take home"
    needs:
      - "Step-by-step guidance"
      - "Troubleshooting help"
      - "Best practices for production use"
  
  key_messages:
    - "FastAPI makes building APIs fast and enjoyable"
    - "Type hints power automatic validation and documentation"
    - "Async programming is easier than you think"
  
  structure:
    total_slides: 50
    sections:
      - name: "Welcome and Setup"
        slides: 5
        duration: 15
        content:
          - "Welcome and introductions"
          - "Workshop objectives and schedule"
          - "Prerequisites check"
          - "Environment setup"
          - "Clone starter repository"
      
      - name: "FastAPI Basics"
        slides: 8
        duration: 20
        content:
          - "What is FastAPI and why use it"
          - "First endpoint - Hello World"
          - "Path parameters"
          - "Query parameters"
          - "Request body with Pydantic"
          - "Exercise 1: Build your first endpoints"
          - "Review solutions"
          - "Q&A break"
      
      - name: "Data Models and Validation"
        slides: 6
        duration: 15
        content:
          - "Pydantic models in depth"
          - "Data validation"
          - "Response models"
          - "Error handling"
          - "Exercise 2: Create data models"
          - "Review solutions"
      
      - name: "Coffee Break"
        slides: 1
        duration: 10
        content:
          - "Break slide with progress recap"
      
      - name: "Database Integration"
        slides: 10
        duration: 25
        content:
          - "SQLAlchemy basics"
          - "Database connection setup"
          - "Creating tables"
          - "CRUD operations"
          - "Exercise 3: Implement CREATE endpoint"
          - "Exercise 4: Implement READ endpoints"
          - "Exercise 5: UPDATE and DELETE"
          - "Database migrations"
          - "Review complete CRUD API"
          - "Q&A"
      
      - name: "Authentication"
        slides: 8
        duration: 20
        content:
          - "OAuth2 with password flow"
          - "Password hashing"
          - "JWT tokens"
          - "Protecting endpoints"
          - "Exercise 6: Add authentication"
          - "Testing authenticated endpoints"
          - "Review solutions"
          - "Security best practices"
      
      - name: "Lunch Break"
        slides: 1
        duration: 30
        content:
          - "Lunch break - continue coding if you want!"
      
      - name: "Testing and Documentation"
        slides: 6
        duration: 15
        content:
          - "Automatic API documentation"
          - "Writing tests with pytest"
          - "Test database setup"
          - "Exercise 7: Write tests"
          - "Code coverage"
          - "Review testing strategy"
      
      - name: "Deployment"
        slides: 4
        duration: 15
        content:
          - "Production configuration"
          - "Docker containerization"
          - "Deploy to cloud platform"
          - "Exercise 8: Deploy your API"
      
      - name: "Wrap Up"
        slides: 1
        duration: 10
        content:
          - "Final Q&A and next steps"
  
  visual_style:
    theme: "Clean and code-focused"
    color_scheme:
      primary: "#009688"
      secondary: "#FF6F00"
      accent: "#7C4DFF"
      background: "#FAFAFA"
      text: "#212121"
    
    typography:
      heading_font: "Roboto"
      body_font: "Roboto"
      code_font: "JetBrains Mono"
    
    layout_preferences:
      - "Large, readable code snippets"
      - "Step numbers for exercises"
      - "Progress indicators between sections"
      - "Minimal text, maximum code"
    
    visual_elements:
      - "Code examples throughout"
      - "Terminal screenshots"
      - "API response examples"
      - "Architecture diagrams"
      - "Progress checkboxes for exercises"
  
  content_guidelines:
    tone: "Encouraging and supportive"
    language_level: "Clear explanations with examples"
    complexity: "Progressive - start simple, build up"
    
    dos:
      - "Provide complete working examples"
      - "Give time for exercises"
      - "Walk around and help individuals"
      - "Celebrate when people succeed"
      - "Show common errors and how to fix them"
    
    donts:
      - "Don't rush through exercises"
      - "Don't assume everyone is at the same pace"
      - "Don't skip error handling"
      - "Don't forget breaks"
  
  technical_notes:
    tools_needed:
      - "Python 3.8+ installed on all machines"
      - "Code editor (VS Code recommended)"
      - "Git for cloning repository"
      - "PostgreSQL or SQLite"
      - "Postman or curl for API testing"
      - "Cloud platform account (Heroku, Railway, etc.)"
    
    special_requirements:
      - "Stable WiFi for all participants"
      - "Projector and screen sharing capability"
      - "Starter repository with boilerplate code"
      - "Sample data for exercises"
      - "Backup USB drives with setup files"
    
    backup_plans:
      - "Pre-built Docker containers if setup fails"
      - "Cloud IDE backup (GitHub Codespaces)"
      - "Completed code examples for each exercise"
      - "Offline documentation"
