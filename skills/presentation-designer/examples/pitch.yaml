presentation:
  metadata:
    title: "DevTools AI: Revolutionizing Developer Productivity"
    author: "Sarah Johnson"
    date: "2026-05-20"
    duration: 10
    type: pitch
    version: "1.0"
  
  purpose:
    primary_goal: "Secure seed funding by demonstrating market opportunity and product vision"
    objectives:
      - "Show clear problem and large market"
      - "Demonstrate unique solution and traction"
      - "Build confidence in team execution ability"
      - "Get to next meeting or funding commitment"
    success_criteria:
      - "Investors request detailed financials"
      - "Follow-up meeting scheduled"
      - "At least one term sheet interest"
  
  audience:
    profile: "Early-stage VCs focused on developer tools and AI"
    size: "3-5 partners in the room"
    knowledge_level: "Business-savvy, some technical background"
    expectations:
      - "Clear, compelling story"
      - "Strong market validation"
      - "Realistic financials"
      - "Exceptional team"
    needs:
      - "Quick understanding of opportunity"
      - "Confidence in execution"
      - "Clear differentiation"
      - "Path to $100M+ revenue"
  
  key_messages:
    - "Developers waste 30% of time on repetitive tasks - we fix that"
    - "$50B market with perfect timing (AI boom + developer shortage)"
    - "Already $500K ARR with 50+ enterprise customers"
  
  structure:
    total_slides: 10
    sections:
      - name: "Hook"
        slides: 1
        duration: 0.5
        content:
          - "Compelling problem statement with stat"
      
      - name: "Problem"
        slides: 1
        duration: 1
        content:
          - "Developer productivity crisis with specific pain points"
      
      - name: "Solution"
        slides: 2
        duration: 2
        content:
          - "How our AI platform solves it"
          - "Product demo screenshot/video"
      
      - name: "Market Opportunity"
        slides: 1
        duration: 1
        content:
          - "TAM/SAM/SOM with growth projections"
      
      - name: "Business Model"
        slides: 1
        duration: 1
        content:
          - "Pricing and revenue streams"
      
      - name: "Traction"
        slides: 1
        duration: 1.5
        content:
          - "Growth metrics, customers, revenue"
      
      - name: "Competitive Advantage"
        slides: 1
        duration: 1
        content:
          - "Why we win vs alternatives"
      
      - name: "Team"
        slides: 1
        duration: 1
        content:
          - "Founders and key hires with credentials"
      
      - name: "The Ask"
        slides: 1
        duration: 1
        content:
          - "Funding amount, use of funds, milestones"
  
  visual_style:
    theme: "Clean, professional, modern"
    color_scheme:
      primary: "#6366F1"
      secondary: "#8B5CF6"
      accent: "#EC4899"
      background: "#FFFFFF"
      text: "#111827"
    
    typography:
      heading_font: "Inter"
      body_font: "Inter"
      code_font: "JetBrains Mono"
    
    layout_preferences:
      - "Minimal text - big numbers and visuals"
      - "One key point per slide"
      - "Consistent layout for credibility"
      - "High visual impact"
    
    visual_elements:
      - "Product screenshots"
      - "Growth charts with clear upward trajectory"
      - "Simple icons for concepts"
      - "Team photos (professional headshots)"
      - "Customer logos (social proof)"
  
  content_guidelines:
    tone: "Confident but not arrogant, data-driven"
    language_level: "Business-focused, minimize jargon"
    complexity: "Simple and clear - assume business audience"
    
    dos:
      - "Lead with the problem, not the solution"
      - "Use specific numbers and metrics"
      - "Show momentum and growth"
      - "Make the market size credible"
      - "Demonstrate deep domain expertise"
      - "End with clear, specific ask"
    
    donts:
      - "Don't spend too much time on product details"
      - "Don't show weak or confusing metrics"
      - "Don't trash competitors"
      - "Don't show unrealistic projections"
      - "Don't read from slides"
  
  technical_notes:
    tools_needed:
      - "Laptop with presentation software"
      - "Product demo ready (pre-recorded backup)"
      - "Clicker for smooth transitions"
    
    special_requirements:
      - "High-quality projector/screen"
      - "Working internet for live demo"
      - "Pitch deck PDF backup on USB"
    
    backup_plans:
      - "Pre-recorded demo video if live demo fails"
      - "Printed deck for each investor"
      - "Mobile backup of slides"
      - "Rehearsed answers to common objections"
    
    appendix_slides:
      - "Detailed financials (3-year projection)"
      - "Competitive matrix"
      - "Technical architecture"
      - "Customer testimonials"
      - "Team bios"
      - "Market research sources"
