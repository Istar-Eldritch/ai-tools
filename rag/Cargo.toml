[package]
name = "rag-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
pgvector = { version = "0.4", features = ["sqlx"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "migrate"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
fastembed = "4"
aws-sdk-s3 = "1"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest"] }
aws-credential-types = "1"
bytes = "1"
text-splitter = { version = "0.29", features = ["markdown"] }
rmcp = { version = "1", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Versions verified against crates.io 2026-04-08; grammar crates have different release cadences
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
walkdir = "2"
globset = "0.4"
sha2 = "0.10"
futures = "0.3"

[dev-dependencies]
testcontainers = { version = "0.25", features = ["watchdog"] }
testcontainers-modules = { version = "0.13", features = ["postgres"] }
