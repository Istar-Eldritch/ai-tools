[package]
name = "claude-sandbox"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"

[lib]
name = "claude_sandbox"
path = "src/lib.rs"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "2.1"
tempfile = "3"
toml = "0.8"

[[test]]
name = "config"
path = "tests/config.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"

[[test]]
name = "bwrap"
path = "tests/bwrap.rs"
