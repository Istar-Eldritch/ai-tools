description = "Rust development profile with Cargo and Rustup access"

rw_paths = [
    "~/.claude/",
    "~/.cargo/registry/",
    "/tmp",
]

ro_paths = [
    "/usr",
    "/lib",
    "/lib64",
    "/bin",
    "/sbin",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl",
    "/etc/alternatives/",
    "~/.cargo/",
    "~/.rustup/",
    "~/code/ai_tools",
    "~/.local",
    "~/.config",
    "~/.gitconfig",
    "~/.gitignore_global"
]

excluded_paths = []

env = [
    "CARGO_HOME",
    "RUSTUP_HOME",
]
