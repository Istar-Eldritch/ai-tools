description = "Rust development profile with Cargo and Rustup access"

rw_paths = [
    "~/.claude/",
]

ro_paths = [
    "/usr",
    "/lib",
    "/lib64",
    "/bin",
    "/sbin",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl",
    "~/.cargo/registry",
    "~/.rustup/",
]

excluded_paths = []

env = [
    "CARGO_HOME",
    "RUSTUP_HOME",
]
