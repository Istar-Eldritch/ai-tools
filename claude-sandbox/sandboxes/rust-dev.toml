description = "Rust development profile with Cargo and Rustup access"

rw_paths = [
    "~/.claude/",
    "~/.cargo/registry/",
    "/tmp",
    "/var/run/docker.sock",
]

ro_paths = [
    "/usr",
    "/lib",
    "/lib64",
    "/bin",
    "/sbin",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl",
    "/etc/alternatives/",
    "/etc/alsa/",
    "/etc/chromium.d/",
    "/dev/snd/",
    "/proc/asound/",
    "/run/user/1000/pulse/",
    "/run/user/1000/pipewire-0",
    "/run/user/1000/pipewire-0-manager",
    "/run/user/1000/keyring/",
    "/run/user/1000/bus",
    "~/.cargo/",
    "~/.rustup/",
    "~/code/ai_tools",
    "~/.local",
    "~/.config",
    "~/.gitconfig",
    "~/.gitignore_global",
    "~/.ssh"
]

excluded_paths = []

env = [
    "CARGO_HOME",
    "RUSTUP_HOME",
    "XDG_RUNTIME_DIR",
    "DBUS_SESSION_BUS_ADDRESS",
]
