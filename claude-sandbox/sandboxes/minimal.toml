description = "Minimal profile for basic Claude Code usage"

rw_paths = [
    "~/.claude/",
]

ro_paths = [
    "/usr",
    "/lib",
    "/lib64",
    "/bin",
    "/sbin",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl",
    "/etc/alternatives/",
    "/etc/alsa/",
    "/dev/snd/",
    "/proc/asound/",
    "/run/user/1000/pulse/",
    "/run/user/1000/pipewire-0",
    "/run/user/1000/pipewire-0-manager",
    "~/code/ai_tools",
    "~/.local",
    "~/.config",
    "~/.cargo/bin/",
    "~/.gitconfig",
    "~/.gitignore_global"
]

excluded_paths = []

env = [
    "XDG_RUNTIME_DIR",
]
