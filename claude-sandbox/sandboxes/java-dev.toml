description = "Java/Maven development profile with Maven repository access"

rw_paths = [
    "~/.claude/",
]

ro_paths = [
    "/usr",
    "/lib",
    "/lib64",
    "/bin",
    "/sbin",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl",
    "~/.m2/repository",
]

excluded_paths = []

env = [
    "JAVA_HOME",
    "MAVEN_HOME",
]
