description = "Java/Maven development profile with Maven repository access"

rw_paths = [
    "~/.claude/",
    "~/.gradle/",
    "~/.m2/"
]

ro_paths = [
    "/usr",
    "/lib",
    "/lib64",
    "/bin",
    "/sbin",
    "/etc/resolv.conf",
    "/etc/hosts",
    "/etc/ssl",
    "/etc/alternatives/",
    "/etc/alsa/",
    "/dev/snd/",
    "/proc/asound/",
    "/run/user/1000/pulse/",
    "/run/user/1000/pipewire-0",
    "/run/user/1000/pipewire-0-manager",
    "~/code/ai_tools",
    "~/.cargo/bin",
    "~/.local",
    "~/.config",
    "~/.cargo/bin/",
    "~/.gitconfig",
    "~/.gitignore_global",
    "~/.config/gh",
]

excluded_paths = []

env = [
    "XDG_RUNTIME_DIR",
    "JAVA_HOME",
    "MAVEN_HOME",
]
